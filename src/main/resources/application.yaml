spring:
  application:
    name: service-cp-crime-results-enforcementgateway
  artemis:
    mode: native
    broker-url: ${ARTEMIS_BROKER_URL:tcp://localhost:61616}
    user: ${ARTEMIS_USER:admin}
    password: ${ARTEMIS_PASSWORD:admin}
  jms:
    pub-sub-domain: true          # public.event is a multicast topic
    subscription-durable: true    # durable so events queued while down are still delivered
    client-id: service-cp-crime-results-enforcementgateway
    listener:
      # OFF by default so the service (and the actuator test) start without a broker;
      # set ARTEMIS_LISTENER_ENABLED=true to attach the durable subscriber.
      auto-startup: ${ARTEMIS_LISTENER_ENABLED:false}

server:
  port: ${SERVER_PORT:8082}

# CP listing public-event consumption (FR09/FR11).
enforcementgateway:
  messaging:
    public-event-topic: public.event
    subscription-name: service-cp-crime-results-enforcementgateway.public.event
    selector: "CPPNAME IN ('public.listing.hearing-confirmed','public.listing.hearing-updated')"

azure:
  application-insights:
    instrumentation-key: ${rpe.AppInsightsInstrumentationKey:00000000-0000-0000-0000-000000000000}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true   # enables liveness / readiness groups

logging:
  level:
    root: INFO
